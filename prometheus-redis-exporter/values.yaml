# =========================
# Redis Exporter Helm Values
# =========================

rbac:
  create: true

serviceAccount:
  create: true
  name: redis-exporter

replicaCount: 1

image:
  repository: oliver006/redis_exporter
  tag: v1.81.0
  pullPolicy: IfNotPresent
  pullSecrets: []

command: []
extraArgs: {}

customLabels: {}
securityContext: {}

env: {}

service:
  type: ClusterIP
  port: 9121
  targetPort: 9121
  annotations: {}
  labels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
extraManifests: []

# Redis connection
redis:
  address: redis://redis:6379

annotations: {}
labels: {}

redisAddressConfig:
  enabled: false
  isSecret: false
  source:
    name: ""
    key: ""

redisTlsConfig:
  enabled: false
  skipTlsVerification: false

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

# Authentication
auth:
  enabled: true
  redisPassword: redis-123
  redisUser: ""
  secret:
    name: ""
    key: ""
  redisPasswordFile:
    enabled: false
    mountPath: /auth
    secret:
      name: ""
      key: ""

networkPolicy:
  enabled: false
  ingressFrom: []

podSecurityContext: {}
